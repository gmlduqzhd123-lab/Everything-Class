name: Deploy elementary lesson library
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson-library-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate catalog and build
    if: github.event_name != 'schedule' || vars.PUBLIC_CATALOG_CSV_URL != ''
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.revision.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build from published Sheet
        if: github.ref == 'refs/heads/main' && vars.PUBLIC_CATALOG_CSV_URL != ''
        env:
          PUBLIC_CATALOG_CSV_URL: ${{ vars.PUBLIC_CATALOG_CSV_URL }}
        run: |
          node scripts/download-catalog.mjs "$RUNNER_TEMP/sheet-catalog.csv"
          CATALOG_FILE="$RUNNER_TEMP/sheet-catalog.csv" npm run build
      - name: Build from repository catalog
        if: github.ref != 'refs/heads/main' || vars.PUBLIC_CATALOG_CSV_URL == ''
        run: npm run build
      - name: Check for changes since the last successful deployment
        id: revision
        if: github.ref == 'refs/heads/main'
        env:
          PUBLIC_REVISION_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/revision.txt
        run: |
          if curl --silent --fail --max-time 10 --max-filesize 512 \
              --header 'Cache-Control: no-cache' \
              "$PUBLIC_REVISION_URL?check=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --output "$RUNNER_TEMP/published-revision.txt" \
              && cmp -s dist/revision.txt "$RUNNER_TEMP/published-revision.txt"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload site
        if: steps.revision.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.changed == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
