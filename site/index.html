<!doctype html>
<html lang="ko" data-qr-url="https://gmlduqzhd123-lab.github.io/Everything-Class/" data-qr-name="초등 수업 대백과">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="초등학교 1~6학년 교과와 계기교육에 활용할 수 있는 수업 영상을 찾아보세요.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>초등 수업 대백과</title>
  <meta name="theme-color" content="#6366f1">
  <meta property="og:type" content="website">
  <meta property="og:title" content="초등 수업 대백과">
  <meta property="og:description" content="초등학교 1~6학년 교과와 계기교육에 활용할 수 있는 수업 영상을 찾아보세요.">
  <meta property="og:url" content="https://gmlduqzhd123-lab.github.io/Everything-Class/">
  <meta property="og:image" content="https://gmlduqzhd123-lab.github.io/Everything-Class/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://gmlduqzhd123-lab.github.io/Everything-Class/og-image.jpg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="수업 대백과">
  <link rel="stylesheet" href="./style.css">
  <!-- 📲 앱 설치 · 📱 QR (엽쌤의 다른 앱과 같은 도우미) -->
  <script src="./ys-install.js" defer></script>
  <script src="./ys-qr.js" defer></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#main">본문 바로가기</a>
  <header class="header">
    <div class="wrap header-inner">
      <a class="brand" href="./" aria-label="초등 수업 대백과 홈"><span class="brand-icon" aria-hidden="true"><i></i></span>초등 수업 대백과</a>
      <div class="header-actions">
        <button class="quiet ys-chip" type="button" data-ys-install>📲 <span class="ys-wide">앱&nbsp;</span>설치</button>
        <button class="quiet ys-chip" type="button" data-qr aria-label="QR 코드로 접속">📱 QR</button>
        <button class="quiet share-site" type="button" aria-label="사이트 공유"><span aria-hidden="true">↗</span> 사이트 공유</button>
      </div>
    </div>
  </header>
  <main id="main" class="wrap">
    <section class="hero" aria-labelledby="intro">
      <h1 id="intro">수업 영상 찾기</h1>
      <div class="hero-search">
        <form class="search" role="search">
          <label class="sr-only" for="query">수업 영상 검색</label>
          <span class="search-icon" aria-hidden="true"></span>
          <input type="search" id="query" placeholder="예: 4학년 과학 물의 상태 변화" maxlength="120" autocomplete="off">
          <button type="submit">검색</button>
        </form>
        <a class="quiet hero-occasion" id="current-occasion" href="./" hidden>이번 달 계기교육</a>
      </div>
    </section>
    <section class="library" aria-labelledby="library-title">
      <div class="library-nav" role="group" aria-label="영상 자료실">
        <button type="button" id="browse" class="view-button" aria-pressed="true">수업 영상</button>
        <button type="button" id="video-shelf" class="view-button" aria-pressed="false">내 수업 영상함</button>
      </div>
      <form id="filters" class="filters" aria-label="영상 필터">
        <fieldset class="grade-field">
          <legend>학년</legend>
          <div id="grades" class="grades"></div>
        </fieldset>
        <div class="select-field"><label for="subject">교과·활동</label><select id="subject"><option value="">전체 교과·활동</option></select></div>
        <div class="select-field" id="occasion-month-field" hidden><label for="occasion-month">활용 월</label><select id="occasion-month" disabled><option value="">전체 월</option></select></div>
        <div class="select-field"><label for="semester">학기</label><select id="semester"><option value="">전체 학기</option><option value="1">1학기</option><option value="2">2학기</option></select></div>
        <div class="select-field" id="unit-field"><label for="unit">단원</label><select id="unit" disabled><option value="">학년·교과를 선택하세요</option></select></div>
        <div class="select-field"><label for="length">영상 길이</label><select id="length">
          <option value="">전체 길이</option>
          <option value="short">3분 이하</option>
          <option value="medium">3분 초과~10분</option>
          <option value="long">10분 초과</option>
        </select></div>
      </form>
      <div id="active-filters" class="active-filters" role="group" aria-label="선택한 검색 조건" hidden></div>
      <div id="shelf-controls" class="shelf-controls" hidden>
        <div class="shelf-switch" role="group" aria-label="저장된 영상 보기">
          <button type="button" class="quiet view-button" data-shelf="favorites" aria-pressed="true">즐겨찾기</button>
          <button type="button" class="quiet view-button" data-shelf="recent" aria-pressed="false">최근 재생</button>
        </div>
        <p>이 브라우저에 저장됩니다.</p>
      </div>
      <div class="results-toolbar">
        <div class="results-heading">
          <h2 id="library-title" tabindex="-1">전체 영상</h2>
          <p id="results-count" role="status">영상 목록을 불러오는 중입니다.</p>
        </div>
        <div id="list-actions" class="list-actions">
          <label class="sr-only" for="order">영상 정렬</label>
          <select id="order"><option value="">기본순</option><option value="short">짧은 순</option></select>
          <button id="share-list" type="button" class="quiet" hidden>목록 링크 복사</button>
        </div>
      </div>
      <div id="results" class="grid"></div>
      <div id="more-row" class="more-row" hidden><button id="more" class="quiet" type="button">영상 더 보기</button></div>
      <noscript><p>영상 검색과 재생을 이용하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
    </section>
  </main>
  <footer class="footer"><div class="wrap"><strong>초등 수업 대백과</strong><p>영상은 각 YouTube 채널에서 제공하며, 재생을 누르면 YouTube 플레이어가 로드됩니다.</p><p class="ys-credit">© 2026 엽쌤. All rights reserved. · <a href="https://gmlduqzhd123-lab.github.io/YScode/">엽쌤의 다른 앱 보기 →</a></p></div></footer>
  <dialog id="detail" aria-labelledby="video-title"><div id="detail-body"></div></dialog>
  <p id="toast" class="toast" role="status" hidden></p>
  <template id="card-template">
    <article class="card">
      <a class="card-image"><img loading="lazy" decoding="async" alt=""><span class="play" aria-hidden="true"></span><span class="duration"></span></a>
      <div class="card-body"><div class="badges"></div><h3><a class="card-title"></a></h3><p class="card-topic"></p><div class="card-actions"><p class="card-channel"></p><button type="button" class="quiet save-video">저장</button></div></div>
    </article>
  </template>
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));</script>
</body>
</html>
